name: Deploy to VPS

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    # ВАЖНО: деплой НЕ зависит от CI — работает независимо
    # CI служит только для информации о качестве кода

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-tag version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Создать тег если скрипт существует, иначе пропустить
          if [ -f "deploy/scripts/tag_version.sh" ]; then
            chmod +x deploy/scripts/tag_version.sh
            ./deploy/scripts/tag_version.sh || true
          fi

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            set -e

            echo "==> Navigating to project..."
            cd /opt/hunger-platform

            echo "==> Pulling latest code..."
            git fetch --all
            git checkout main
            git pull origin main

            echo "==> Running DB migrations..."
            docker compose exec -T backend alembic upgrade head || \
            docker compose exec -T api alembic upgrade head || \
            echo "Migration skipped (container not running yet)"

            echo "==> Building and restarting..."
            docker compose build --no-cache backend frontend
            docker compose up -d --remove-orphans

            echo "==> Waiting for startup..."
            sleep 8

            echo "==> Health check..."
            curl -sf http://localhost:8000/healthz \
              || curl -sf http://localhost:8000/health \
              || curl -sf http://localhost:8000/api/health \
              || echo "Health check skipped"

            echo "==> Deploy complete!"
            docker compose ps
