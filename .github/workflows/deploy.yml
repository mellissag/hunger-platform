name: Deploy to VPS

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-tag version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f "deploy/scripts/tag_version.sh" ]; then
            chmod +x deploy/scripts/tag_version.sh
            ./deploy/scripts/tag_version.sh || true
          fi

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 30m
          script_stop: true
          script: |
            set -e

            echo "==> Pulling latest code..."
            cd /opt/hunger-platform
            git fetch --all
            git checkout main
            git pull origin main

            echo "==> Moving to compose directory..."
            cd /opt/hunger-platform/deploy

            echo "==> Running DB migrations..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file ../.env \
              exec -T api alembic upgrade head || \
              echo "Migration skipped (container not running yet)"

            echo "==> Building containers..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file ../.env \
              build --no-cache api web

            echo "==> Restarting services..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file ../.env \
              up -d --remove-orphans

            echo "==> Waiting for startup..."
            sleep 10

            echo "==> Health check..."
            curl -sf http://localhost:8000/healthz \
              || curl -sf http://localhost:8000/health \
              || curl -sf http://localhost:8000/api/health \
              || echo "Health check skipped"

            echo "==> Deploy complete!"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file ../.env ps
