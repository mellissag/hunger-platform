name: Release

# Триггер: git tag vX.Y.Z → build + push образов на GHCR + создание GitHub Release
# Пример: git tag v1.2.0 && git push origin v1.2.0
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"   # pre-release: v1.0.0-rc.1

env:
  REGISTRY: ghcr.io

jobs:
# ── Build & push images ───────────────────────────────────────────────────────
  build-push:
    name: Build & push images (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: backend
          - service: frontend
            context: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          tags: |
            # v1.2.3 → tags: 1.2.3, 1.2, latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}
            # Pre-release: v1.0.0-rc.1 → tag rc.1 (no latest)
            type=semver,pattern={{version}},enable=${{ contains(github.ref, '-') }}
          labels: |
            org.opencontainers.image.title=Hunger Beauty ${{ matrix.service }}
            org.opencontainers.image.description=Hunger Beauty Platform — ${{ matrix.service }} service
            org.opencontainers.image.vendor=Hunger Platform

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: true
          sbom: true

# ── Trivy scan of released images ────────────────────────────────────────────
  scan-images:
    name: Trivy image scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [build-push]
    permissions:
      security-events: write
      packages: read

    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy scan — ${{ matrix.service }}
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ github.ref_name }}
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: sarif
          output: trivy-${{ matrix.service }}.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
        continue-on-error: true

# ── Create GitHub Release ─────────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-push]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # нужно для changelog

      - name: Prepare install.sh with correct image tag
        run: |
          # Подставляем реальный тег в install.sh для этого релиза
          TAG="${{ github.ref_name }}"
          sed "s|IMAGE_TAG:-latest|IMAGE_TAG:-${TAG}|g; \
               s|: \"\${IMAGE_TAG:=latest}\"|: \"\${IMAGE_TAG:=${TAG}}\"|g" \
            deploy/scripts/install.sh > /tmp/install.sh
          chmod +x /tmp/install.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Hunger Beauty ${{ github.ref_name }}"
          files: |
            /tmp/install.sh
          generate_release_notes: true
          body: |
            ## 🚀 Установка на чистый Ubuntu 24.04

            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/install.sh | sudo bash
            ```

            > **Требования:** Ubuntu 22.04/24.04, открытые порты 80/443, домен с A-записью, Telegram Bot Token.

            ---

            ## 📦 Docker образы

            ```
            ghcr.io/${{ github.repository }}/backend:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/frontend:${{ github.ref_name }}
            ```

            Или через `docker-compose.prod.yml`:
            ```bash
            IMAGE_TAG=${{ github.ref_name }} docker compose \
              -f deploy/docker-compose.yml \
              -f deploy/docker-compose.prod.yml \
              --env-file .env up -d
            ```

            ---

            ## 📚 Документация

            - [Руководство по установке](docs/INSTALL.md)
            - [Руководство администратора](docs/ADMIN_GUIDE.md)
            - [Руководство мастера](docs/MASTER_GUIDE.md)

            ---

            ## 🔄 Обновление с предыдущей версии

            ```bash
            bash /opt/hunger-platform/deploy/scripts/update.sh ${{ github.ref_name }}
            ```
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
