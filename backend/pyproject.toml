[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hunger-beauty-backend"
version = "0.1.0"
description = "Hunger Beauty — FastAPI + aiogram backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30.0",
    "aiogram>=3.15.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "arq>=0.26.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1,<4.1",
    "structlog>=24.0.0",
    "loguru>=0.7.0",
    "redis>=5.0.0",
    "babel>=2.16.0",
    "fluent.runtime>=0.4.0",
    "pgvector>=0.3.0",
    "google-generativeai>=0.8.0",
    "psycopg2-binary>=2.9.0",
    "slowapi>=0.1.9",
    "email-validator>=2.0.0",
    "aiofiles>=24.1.0",
    "openpyxl>=3.1.0",
    "fpdf2>=2.7.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "testcontainers[postgres]>=4.0.0",
    "respx>=0.21.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "black>=24.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
extend-ignore = ["D"]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "passlib.*", "jose.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
concurrency = ["thread", "greenlet"]
omit = [
    "app/models/*",
    "app/db/*",
]
